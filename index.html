<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Style Admin System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      background-image: radial-gradient(#3a3a3a 15%, transparent 16%), radial-gradient(#2a2a2a 15%, transparent 16%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Minecraft Header Title */
    .title-container {
      margin-top: 40px;
      text-align: center;
      position: relative;
    }

    .minecraft-title {
      font-size: 32px;
      color: #dddddd;
      text-shadow: 4px 4px 0px #000000, -2px -2px 0px #555555;
      letter-spacing: 2px;
    }

    .splash-text {
      color: #ffff55;
      font-size: 10px;
      position: absolute;
      right: -20px;
      bottom: -15px;
      transform: rotate(-15deg);
      animation: pulse 0.8s infinite alternate;
      text-shadow: 2px 2px 0px #3f3f00;
    }

    @keyframes pulse {
      0% { transform: rotate(-15deg) scale(1); }
      100% { transform: rotate(-15deg) scale(1.1); }
    }

    /* UI Panels & Boxes */
    .mc-panel {
      background: #c6c6c6;
      border: 4px solid #ffffff;
      border-right-color: #555555;
      border-bottom-color: #555555;
      padding: 20px;
      width: 90%;
      max-width: 700px;
      margin: 20px 0;
      color: #000;
      box-shadow: inset -4px -4px 0px #555555, inset 4px 4px 0px #ffffff;
    }

    /* Minecraft Buttons */
    .mc-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #7c7c7c;
      border: 3px solid #ffffff;
      border-right-color: #373737;
      border-bottom-color: #373737;
      color: #ffffff;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000000;
      box-shadow: inset -3px -3px 0px #373737, inset 3px 3px 0px #ffffff;
    }

    .mc-btn:hover {
      background: #8b8b22;
      border-color: #ffffa0;
      border-right-color: #3b3b00;
      border-bottom-color: #3b3b00;
      color: #ffffa0;
    }

    .mc-btn:active {
      border-color: #373737;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      box-shadow: inset 3px 3px 0px #000000;
    }

    /* Text Inputs */
    .mc-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      background: #000000;
      border: 2px solid #a0a0a0;
      color: #ffffff;
      font-size: 10px;
      outline: none;
    }

    .mc-input:focus {
      border-color: #ffffff;
    }

    /* 2D Mesh Canvas */
    canvas {
      background: #000;
      border: 3px solid #555;
      display: block;
      margin: 10px auto;
      cursor: crosshair;
    }

    /* Hidden Utility Classes */
    .hidden {
      display: none !important;
    }

    .criminal-card {
      background: #a0a0a0;
      border: 2px solid #000;
      padding: 10px;
      margin-bottom: 10px;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <div class="minecraft-title">MINECRAFT ADMIN</div>
    <div class="splash-text">Now with 2D Mesh Generation!</div>
  </div>

  <!-- LOGIN PANEL -->
  <div id="login-panel" class="mc-panel">
    <h3 style="margin-top: 0;">LOG IN</h3>
    <label>USERNAME:</label>
    <input type="text" id="username" class="mc-input" placeholder="Enter username...">
    
    <label>PASSWORD:</label>
    <input type="password" id="password" class="mc-input" placeholder="Enter password...">

    <button class="mc-btn" onclick="handleLogin()">LOG IN</button>
    <p id="login-msg" style="color: red; font-size: 8px;"></p>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard" class="mc-panel hidden">
    <h3 style="margin-top:0;">ADMIN DASHBOARD</h3>

    <!-- 2D MESH FEATURE -->
    <h4>2D MESH GENERATOR</h4>
    <p style="font-size: 8px;">Click on the grid to create mesh nodes and connect geometry:</p>
    <canvas id="meshCanvas" width="600" height="250"></canvas>
    <button class="mc-btn" onclick="clearMesh()">CLEAR MESH</button>

    <hr style="border: 2px solid #555; margin: 20px 0;">

    <!-- CRIMINAL DATABASE -->
    <h4>CRIMINAL RECORDS</h4>
    <div id="criminal-list">
      <div class="criminal-card">
        <strong>NAME:</strong> Steve "Grief" Smith<br>
        <strong>CRIME:</strong> Stealing diamonds & lava griefing<br>
        <strong>STATUS:</strong> Banned from server
      </div>
    </div>

    <button class="mc-btn" onclick="addCase()">ADD NEW CASE</button>
    <button class="mc-btn" style="background:#8b2222;" onclick="handleLogout()">LOGOUT</button>
  </div>

  <script>
    // Authentication Logic (Credentials hidden from UI)
    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const msg = document.getElementById('login-msg');

      if (u === 'admin' && p === 'admin123') {
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        initCanvas();
      } else {
        msg.innerText = "INVALID CREDENTIALS!";
      }
    }

    function handleLogout() {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-panel').classList.remove('hidden');
    }

    // 2D Mesh Generator Canvas Logic
    let canvas, ctx;
    let nodes = [];

    function initCanvas() {
      canvas = document.getElementById('meshCanvas');
      ctx = canvas.getContext('2d');
      canvas.addEventListener('click', addNode);
      drawMesh();
    }

    function addNode(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      nodes.push({x, y});
      drawMesh();
    }

    function clearMesh() {
      nodes = [];
      drawMesh();
    }

    function drawMesh() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw gridlines
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw mesh connections
      ctx.strokeStyle = '#55ff55';
      ctx.lineWidth = 2;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dist = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw nodes
      ctx.fillStyle = '#ff5555';
      nodes.forEach(node => {
        ctx.fillRect(node.x - 4, node.y - 4, 8, 8);
      });
    }

    // Add Case Logic
    function addCase() {
      const name = prompt("Enter offender name:", "Herobrine");
      const crime = prompt("Enter crime:", "Unlawful bedrock manipulation");
      if (name && crime) {
        const list = document.getElementById('criminal-list');
        const card = document.createElement('div');
        card.className = 'criminal-card';
        card.innerHTML = `<strong>NAME:</strong> ${name}<br><strong>CRIME:</strong> ${crime}<br><strong>STATUS:</strong> Under Investigation`;
        list.appendChild(card);
      }
    }
  </script>
</body>
</html>
